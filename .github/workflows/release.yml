name: Release 构建 macOS / Windows 成品

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布到哪个 Release tag
        required: false
        default: v0.1.0

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-mac.txt
          pip install pyinstaller pillow
      - name: 打包 App
        run: python build_app.py
      - name: 打包 zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/SwitchScope.app SwitchScope-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchScope-macOS
          path: SwitchScope-macOS.zip

  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-win.txt
          pip install pyinstaller pillow
      - name: 打包 exe
        run: python build_app.py
      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path dist/SwitchScope.exe -DestinationPath SwitchScope-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchScope-Windows
          path: SwitchScope-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入的 tag，推送 tag 时用被推送的 tag
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/SwitchScope-macOS.zip
            artifacts/SwitchScope-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
